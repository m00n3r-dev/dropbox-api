[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid"] }
dotenvy = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tower-http = { version = "0.7.1", features = ["cors"] }
[dev-dependencies]
tower = "0.5"
tokio = { version = "1.0", features = ["full"] }
axum = "0.8"
serde_json = "1.0"
